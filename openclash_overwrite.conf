[General]
# 1. 核心与基础配置
CORE_TYPE = Meta
EN_MODE = fake-ip
PROXY_MODE = rule
ROUTER_SELF_PROXY = 1
IPV6_ENABLE = 1
IPV6_DNS = 1
ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_PURE_IP = 1

# 2. 自动从 GitHub 实时下载你的 Seven1 完整规则文件
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/yzxicq/openwrt/refs/heads/main/openclash_overwrite.yaml, path=/etc/openclash/config/home.yaml, force=true, RESTART=false

[Overwrite]
# 3. 仅精准注入 EN_KEY1 订阅地址，其余所有核心、DNS、规则均由云端 YAML 托管
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "MiSub" "['url']" "$EN_KEY1"
