  Anchor_PR: &Anchor_PR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}, exclude-filter: "(?i)(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置)"}
  
  # ══ 出站锚点 ══
