tun:
  enable: false                                                          
  stack: mixed                                                          
  dns-hijack: [udp://any:53, tcp://any:53]                              
  auto-detect-interface: true                                           
  auto-route: true                                                      
  auto-redirect: true                                                   
  strict-route: false                                                   
  endpoint-independent-nat: true                                        
  route-exclude-address-set: [cn_ip]                                    

sniffer:
